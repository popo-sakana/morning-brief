name: 毎朝のブリーフを作る

on:
  schedule:
    # なぜ5時台か:
    #   官庁（水産庁・農水省）は早朝に動かず、前日10〜18時に出そろうので制約になりません。
    #   縛りになるのは日刊水産経済新聞で、毎朝5時に更新されます。これを拾える最速が5時台。
    #   米国のAI企業の発表は日本時間の深夜1〜2時台に集中するので、5時ならすでに入っています。
    #
    # なぜ「00分」を避けるか:
    #   GitHub の定時実行は毎時00分に世界中の予約が集中し、遅延や取りこぼしが起きます。
    #   実際 8/26 は1時間遅れ、8/27 は1本も走りませんでした。
    #   そこで00分を外し、さらに保険をもう1本置いています。
    - cron: "47 19 * * *"   # UTC 19:47 = 日本時間 4:47（本番）
    - cron: "23 21 * * *"   # UTC 21:23 = 日本時間 6:23（保険。すでに今日の分があれば何もしない）
  workflow_dispatch:      # 手動でいつでも走らせられるボタンが出ます

permissions:
  contents: write         # 台本・RSSのコミットと、音声のリリース公開に必要

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 保険の実行が、すでにできている今日の回を作り直してしまわないようにする。
      # 手動実行（workflow_dispatch）のときは、作り直したいはずなので素通しします。
      - name: 今日の回がすでにあるか調べる
        id: guard
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Tokyo date +%y%m%d)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動実行なので、そのまま作ります"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f site/episodes.json ] && grep -q "\"${TODAY}_" site/episodes.json; then
            echo "今日（${TODAY}）の回はすでにあります。今回は何もしません"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "今日（${TODAY}）の回はまだありません。作ります"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 必要なライブラリを入れる
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 番組をつくる
        id: build
        if: steps.guard.outputs.skip != 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: python src/run.py

      - name: 音声を公開する
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUDIO="${{ steps.build.outputs.audio_path }}"
          TAG="${{ steps.build.outputs.episode_id }}"
          if [ -z "$AUDIO" ] || [ ! -f "$AUDIO" ]; then
            echo "音声ができていないため、公開をとばします"
            exit 1
          fi
          gh release create "$TAG" "$AUDIO" \
            --title "$TAG" \
            --notes "毎朝のニュースブリーフ（自動生成）" \
            || gh release upload "$TAG" "$AUDIO" --clobber

      - name: 台本とRSSを保存する
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name  "morning-brief bot"
          git config user.email "actions@github.com"
          # まだ存在しないフォルダがあっても止まらないようにする（初回対策）
          for d in site data requests hypotheses out; do
            if [ -d "$d" ]; then git add -A "$d"; fi
          done
          git reset -q -- 'out/*.mp3' 'out/*.wav' 2>/dev/null || true
          git diff --staged --quiet || git commit -m "brief ${{ steps.build.outputs.episode_id }}"
          git push

      - name: 古い回を片づける（40日より前のリリースを削除）
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '40 days ago' +%s)
          gh release list --limit 200 --json tagName,createdAt \
            --jq '.[] | [.tagName, .createdAt] | @tsv' | while IFS=$'\t' read -r tag created; do
              ts=$(date -u -d "$created" +%s)
              if [ "$ts" -lt "$CUTOFF" ]; then
                echo "削除: $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              fi
            done

  # 生成した site/ を GitHub Pages として公開する
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
