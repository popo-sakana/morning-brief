<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朝のニュースブリーフ 全体構成図</title>
<style>
  :root{
    --ground:#ffffff; --ink:#111111; --ink-2:#555555; --ink-3:#8a8a8a;
    --rule-faint:#d6d6d6; --surface:#f4f4f4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#101010; --ink:#ededed; --ink-2:#a9a9a9; --ink-3:#7c7c7c;
      --rule-faint:#333333; --surface:#1b1b1b;
    }
  }
  :root[data-theme="dark"]{
    --ground:#101010; --ink:#ededed; --ink-2:#a9a9a9; --ink-3:#7c7c7c;
    --rule-faint:#333333; --surface:#1b1b1b;
  }
  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink); margin:0;
    font-family:"Meiryo UI","Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    font-size:16px; line-height:1.9;
  }
  .wrap{max-width:60rem;margin:0 auto;padding:40px 20px 90px}
  h1{font-size:1.5rem;margin:0 0 8px;border-bottom:2px solid var(--ink);padding-bottom:16px}
  .lead{color:var(--ink-2);font-size:.92rem;margin:0 0 8px}
  figure{margin:56px 0 0;padding:0}
  figure svg{width:100%;height:auto;display:block;color:var(--ink)}
  figcaption{font-size:.85rem;color:var(--ink-2);margin-top:14px;
             border-top:1px solid var(--rule-faint);padding-top:10px}
  h2{font-size:1rem;margin:56px 0 0;font-weight:700;
     border-left:4px solid var(--ink);padding-left:10px}
  .note{border:1px solid var(--rule-faint);background:var(--surface);
        padding:14px 16px;margin-top:20px;font-size:.88rem;line-height:1.85;color:var(--ink-2)}
  .note strong{color:var(--ink)}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">

<h1>朝のニュースブリーフ 全体構成図</h1>
<p class="lead">2026年8月25日 ／ 誰が何をするか・毎朝の流れ・仮説が偏らない仕組み</p>

<h2>図1　どこに何があるか</h2>

<figure>
<div class="scroll">
<svg viewBox="0 0 900 540" role="img"
     aria-label="各社のAPIとGitHubのサーバーとiPhoneの関係図。Macは最初の設置だけに関わり、毎朝の処理には登場しない">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">

    <!-- 各社のAPI -->
    <text x="60" y="26" font-size="12" fill="currentColor" stroke="none" opacity=".65">外部のサービス（使った分だけ課金）</text>
    <rect x="60"  y="38" width="240" height="60" rx="2"/>
    <rect x="330" y="38" width="240" height="60" rx="2"/>
    <rect x="600" y="38" width="240" height="60" rx="2"/>
    <text x="180" y="64" font-size="14" text-anchor="middle" fill="currentColor" stroke="none">Perplexity</text>
    <text x="180" y="84" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">ニュースを調べる</text>
    <text x="450" y="64" font-size="14" text-anchor="middle" fill="currentColor" stroke="none">Claude</text>
    <text x="450" y="84" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">台本を書く・仮説に照らす</text>
    <text x="720" y="64" font-size="14" text-anchor="middle" fill="currentColor" stroke="none">Google</text>
    <text x="720" y="84" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">読み上げる</text>

    <!-- API への往復 -->
    <line x1="180" y1="170" x2="180" y2="104" marker-end="url(#a1)"/>
    <line x1="450" y1="170" x2="450" y2="104" marker-end="url(#a1)"/>
    <line x1="720" y1="170" x2="720" y2="104" marker-end="url(#a1)"/>
    <text x="196" y="142" font-size="11" fill="currentColor" stroke="none" opacity=".65">毎朝5時に呼ぶ</text>

    <!-- GitHub -->
    <rect x="40" y="170" width="820" height="200" rx="2" stroke-width="2"/>
    <text x="60" y="196" font-size="14" fill="currentColor" stroke="none" font-weight="bold">GitHub のサーバー（クラウド上）</text>
    <text x="270" y="196" font-size="11" fill="currentColor" stroke="none" opacity=".65">公開リポジトリなら無料</text>

    <rect x="66" y="212" width="360" height="140" rx="2" stroke-dasharray="4 3"/>
    <text x="246" y="240" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">毎朝5時に自動で走る</text>
    <text x="246" y="266" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".8">調べる → 仮説に照らす → 台本 → 音声</text>
    <text x="246" y="292" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">所要 約25〜40分</text>
    <text x="246" y="322" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">daily.yml に書いた予定どおり</text>

    <line x1="432" y1="282" x2="468" y2="282" marker-end="url(#a1)"/>

    <rect x="474" y="212" width="360" height="140" rx="2" stroke-dasharray="4 3"/>
    <text x="654" y="240" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">できたものの置き場</text>
    <text x="500" y="268" font-size="11" fill="currentColor" stroke="none" opacity=".8">mp3（30分の音声）</text>
    <text x="500" y="292" font-size="11" fill="currentColor" stroke="none" opacity=".8">feed.xml（Podcastに登録するURL）</text>
    <text x="500" y="316" font-size="11" fill="currentColor" stroke="none" opacity=".8">番組ページ（台本と出典）</text>
    <text x="500" y="340" font-size="11" fill="currentColor" stroke="none" opacity=".8">調査データ・仮説台帳</text>

    <!-- Mac -->
    <rect x="40" y="430" width="300" height="80" rx="2" stroke-dasharray="4 3" opacity=".55"/>
    <text x="190" y="458" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" opacity=".75">あなたの Mac</text>
    <text x="190" y="480" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".6">最初の設置と、あとで掘り返すときだけ</text>
    <text x="190" y="500" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".6">毎朝の処理には登場しない（電源オフでよい）</text>
    <line x1="190" y1="426" x2="190" y2="376" stroke-dasharray="4 3" opacity=".55" marker-end="url(#a1)"/>
    <text x="200" y="406" font-size="11" fill="currentColor" stroke="none" opacity=".55">一度だけアップロード</text>

    <!-- iPhone -->
    <rect x="600" y="430" width="240" height="80" rx="2"/>
    <text x="720" y="458" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">あなたの iPhone</text>
    <text x="720" y="480" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7">Apple Podcasts</text>
    <text x="720" y="500" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" opacity=".6">朝6時に再生するだけ</text>
    <line x1="720" y1="376" x2="720" y2="426" marker-end="url(#a1)"/>
    <text x="732" y="406" font-size="11" fill="currentColor" stroke="none" opacity=".65">自動で降ってくる</text>
  </g>
</svg>
</div>
<figcaption>
  GitHub は「毎朝走らせる場所」と「できた音声を置く場所」の 二役です。Apple Podcasts は「それを聞く道具」で、
  役割が違うので、どちらか一方ではなく両方を使います。Mac は最初の設置のときだけ関わり、以降の毎朝の処理には一切登場しません。
</figcaption>
</figure>

<h2>図2　毎朝5時からの1時間</h2>

<figure>
<div class="scroll">
<svg viewBox="0 0 900 300" role="img"
     aria-label="午前5時に起動し、調査・照合・台本・音声・公開を経て5時45分ごろに完成し、6時に再生されるまでの時系列">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="40" y1="150" x2="856" y2="150" marker-end="url(#a2)"/>

    <!-- 目盛 -->
    <g stroke-width="1">
      <line x1="60"  y1="142" x2="60"  y2="158"/>
      <line x1="230" y1="142" x2="230" y2="158"/>
      <line x1="360" y1="142" x2="360" y2="158"/>
      <line x1="500" y1="142" x2="500" y2="158"/>
      <line x1="650" y1="142" x2="650" y2="158"/>
      <line x1="790" y1="142" x2="790" y2="158"/>
    </g>
    <g font-size="12" fill="currentColor" stroke="none" text-anchor="middle" opacity=".65">
      <text x="60"  y="180">5:00</text>
      <text x="230" y="180">5:20</text>
      <text x="360" y="180">5:25</text>
      <text x="500" y="180">5:35</text>
      <text x="650" y="180">5:45</text>
      <text x="790" y="180">6:00</text>
    </g>

    <!-- 上段：工程 -->
    <g>
      <rect x="60"  y="60" width="160" height="62" rx="2"/>
      <rect x="230" y="60" width="120" height="62" rx="2"/>
      <rect x="360" y="60" width="130" height="62" rx="2"/>
      <rect x="500" y="60" width="140" height="62" rx="2"/>
      <rect x="650" y="60" width="130" height="62" rx="2"/>
    </g>
    <g font-size="12.5" fill="currentColor" stroke="none" text-anchor="middle">
      <text x="140" y="84">調べる</text>
      <text x="290" y="84">仮説に照らす</text>
      <text x="425" y="84">台本を書く</text>
      <text x="570" y="84">読み上げる</text>
      <text x="715" y="84">公開する</text>
    </g>
    <g font-size="10.5" fill="currentColor" stroke="none" text-anchor="middle" opacity=".65">
      <text x="140" y="104">Perplexity 6本</text>
      <text x="290" y="104">Claude 2回</text>
      <text x="425" y="104">Claude 1回</text>
      <text x="570" y="104">Google 約70回</text>
      <text x="715" y="104">RSSを更新</text>
    </g>

    <!-- 下段：中身 -->
    <g font-size="10.5" fill="currentColor" stroke="none" opacity=".6">
      <text x="60"  y="212">4テーマ</text>
      <text x="60"  y="230">＋あなたの注文</text>
      <text x="60"  y="248">＋反証さがし</text>
      <text x="230" y="212">事実カードに分け</text>
      <text x="230" y="230">確からしさを上下</text>
      <text x="360" y="212">検証コーナー</text>
      <text x="360" y="230">＋4テーマ＋論点</text>
      <text x="500" y="212">2つの声で</text>
      <text x="500" y="230">1本のmp3に</text>
      <text x="650" y="212">iPhoneに</text>
      <text x="650" y="230">自動で届く</text>
    </g>

    <!-- 再生 -->
    <line x1="790" y1="122" x2="790" y2="142" marker-end="url(#a2)"/>
    <text x="790" y="112" font-size="12.5" fill="currentColor" stroke="none" text-anchor="middle" font-weight="bold">再生</text>
  </g>
</svg>
</div>
<figcaption>
  5時にしたのは、日刊水産経済新聞のウェブ更新が毎朝5時だからです。GitHub の定時実行は10〜20分遅れることが多く、
  結果として5時15分前後に走ります。官庁の発表は早朝には出ないので、起動を早めても中身は変わりません。
</figcaption>
</figure>

<h2>図3　仮説に引っぱられないための遮断</h2>

<figure>
<div class="scroll">
<svg viewBox="0 0 900 440" role="img"
     aria-label="仮説台帳から調査に渡るのは指標クエリと崩壊条件だけで、見立ての文章は壁に遮られ、判定の段階になって初めて使われる">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">

    <!-- 台帳 -->
    <rect x="30" y="40" width="240" height="220" rx="2" stroke-width="2"/>
    <text x="46" y="66" font-size="13" fill="currentColor" stroke="none" font-weight="bold">仮説台帳</text>
    <rect x="46" y="82" width="208" height="52" rx="2" stroke-dasharray="4 3"/>
    <text x="150" y="103" font-size="12" text-anchor="middle" fill="currentColor" stroke="none">見立ての文章</text>
    <text x="150" y="122" font-size="10" text-anchor="middle" fill="currentColor" stroke="none" opacity=".6">「〜が主因である」</text>
    <rect x="46" y="144" width="208" height="52" rx="2" stroke-dasharray="4 3"/>
    <text x="150" y="165" font-size="12" text-anchor="middle" fill="currentColor" stroke="none">指標クエリ</text>
    <text x="150" y="184" font-size="10" text-anchor="middle" fill="currentColor" stroke="none" opacity=".6">結論を含まない検索語</text>
    <rect x="46" y="206" width="208" height="40" rx="2" stroke-dasharray="4 3"/>
    <text x="150" y="231" font-size="12" text-anchor="middle" fill="currentColor" stroke="none">崩壊条件</text>

    <!-- 壁 -->
    <line x1="340" y1="20" x2="340" y2="290" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="348" y="34" font-size="11" fill="currentColor" stroke="none" opacity=".7">この壁から先へ、見立ての文章は渡さない</text>

    <!-- 遮断された経路 -->
    <line x1="258" y1="108" x2="326" y2="108" stroke-dasharray="3 3" opacity=".5"/>
    <g stroke-width="2.5">
      <line x1="331" y1="99" x2="349" y2="117"/>
      <line x1="349" y1="99" x2="331" y2="117"/>
    </g>

    <!-- 通る経路 -->
    <path d="M258 170 H400" marker-end="url(#a3)"/>
    <path d="M258 226 H330 Q360 226 360 254 V282" marker-end="url(#a3)"/>

    <!-- 調査 -->
    <rect x="406" y="140" width="240" height="62" rx="2"/>
    <text x="526" y="166" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">調べる（4テーマ）</text>
    <text x="526" y="186" font-size="10.5" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">見立てを知らないまま探す</text>

    <rect x="406" y="288" width="240" height="62" rx="2"/>
    <text x="526" y="314" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">反証さがし</text>
    <text x="526" y="334" font-size="10.5" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">支持材料は返させない</text>

    <!-- 事実カード -->
    <rect x="686" y="140" width="184" height="62" rx="2"/>
    <text x="778" y="166" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">事実カード化</text>
    <text x="778" y="186" font-size="10.5" text-anchor="middle" fill="currentColor" stroke="none" opacity=".65">ここもまだ見立てを見ない</text>
    <line x1="652" y1="171" x2="680" y2="171" marker-end="url(#a3)"/>
    <path d="M646 319 H778 V208" marker-end="url(#a3)"/>

    <!-- 判定 -->
    <rect x="406" y="378" width="464" height="52" rx="2" stroke-width="2"/>
    <text x="638" y="410" font-size="13" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">照らし合わせる ─ ここで初めて見立ての文章を見る</text>
    <path d="M778 208 V360 Q778 372 766 372 H650" marker-end="url(#a3)"/>

    <!-- 台帳から判定へ、壁を迂回して届く経路 -->
    <path d="M150 260 V404 H400" stroke-dasharray="6 4" marker-end="url(#a3)"/>
    <text x="162" y="392" font-size="10.5" fill="currentColor" stroke="none" opacity=".65">見立ての文章は、この段階だけで使う</text>
  </g>
</svg>
</div>
<figcaption>
  探すときに見立てを知っていると、それに合う材料ばかりが集まります。だから調べる工程と事実を抜き出す工程には、
  見立ての文章を物理的に渡しません。混ざっていないかを毎朝の実行前に検査し、混ざっていたらその場で止まります。
</figcaption>
</figure>

<div class="note">
  <strong>この3枚で足りない部分</strong><br>
  仮説の確からしさをどう上下させるか、支持証拠が長く出ない仮説をどう降格させるかは、
  図にすると数式の羅列になるため入れていません。README の「仮説を検証していく仕組み」と、
  <code>tests/test_hypotheses.py</code> の8項目に、実際の挙動として書いてあります。
</div>

</div>
</body>
</html>
