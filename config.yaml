# ここは番組の「設定ファイル」です。
# テーマを変えたい・尺を変えたい・声を変えたいときは、原則このファイルだけを直せば済みます。
# （プログラム本体を触る必要はありません）

program:
  title: "popo 朝のニュースブリーフ"
  subtitle: "水産・生成AI・教育の4テーマを毎朝30分で"
  author: "popo"
  language: "ja"
  timezone: "Asia/Tokyo"
  # 1分あたりの日本語文字数の目安。台本の長さ計算に使います。
  # 実際の音声を聞いて長い／短いと感じたら、この数字を上下させてください。
  chars_per_minute: 640

# 話し手の設定。2人の対話形式です。
hosts:
  navigator:
    label: "進行役"
    persona: "聞き手。専門家ではない立場から素朴な疑問を投げ、話を前に進める。相づちは短く。"
    google_voice: "ja-JP-Chirp3-HD-Aoede"     # 女性寄りの声
    openai_voice: "nova"
    voicevox_speaker: 2
  analyst:
    label: "解説役"
    persona: "水産・生成AI・教育を横断して見ている解説者。事実と出典を押さえたうえで、意味づけを一言添える。断定しすぎない。"
    google_voice: "ja-JP-Chirp3-HD-Charon"    # 男性寄りの声
    openai_voice: "onyx"
    voicevox_speaker: 13

# 音声合成の設定
tts:
  # google / openai / voicevox のいずれか。あとから差し替えられます。
  provider: "google"
  speaking_rate: 1.0       # 1.0 が標準。速く聞きたければ 1.1〜1.2
  turn_gap_ms: 320         # 発言と発言のあいだの間（ミリ秒）
  segment_gap_ms: 900      # コーナーとコーナーのあいだの間
  bitrate: "64k"           # 音声ファイルの品質。64k で30分あたり約14MB

# 調査（Perplexity）の設定
research:
  preset: "medium"         # fast / low / medium / high / xhigh。高いほど深く調べ、費用も上がる
  max_results: 12          # 1テーマあたりに読みに行く記事数の上限
  search_context_size: "high"

# 台本づくり（Claude）の設定
script:
  model: "claude-sonnet-5"   # より丁寧にしたい場合は claude-opus-5
  max_output_tokens: 32000

# ここが番組の中身です。テーマを増やす・減らす・書き換えるのは自由です。
segments:
  - id: "jp_fisheries"
    title: "日本の水産"
    minutes: 5
    recency: "week"
    query: |
      日本の水産業に関する直近1週間の重要ニュースを調べてください。
      優先順位は次のとおりです。上位のテーマで十分な材料があれば、下位は無理に含めなくて構いません。
        1. 養殖魚（ぶり類、まだい、くろまぐろ、サーモン類など）— 生産、価格、需給、事故・斃死、飼料、法制度、企業動向
        2. 天然魚（漁獲量、資源管理、TAC、不漁・豊漁、漁業者の経営）
        3. その他（流通、加工、輸出入、水産政策、補助事業）
      海藻類・藻場・ブルーカーボンの話題は除外してください。
      それぞれについて「何が起きたか」「数字」「なぜ重要か」を、必ず出典URLとともに整理してください。

  - id: "world_fisheries"
    title: "世界の水産"
    minutes: 5
    recency: "week"
    query: |
      世界の水産養殖・水産物消費に関する直近1週間の重要ニュースを調べてください。
      最優先は「ぶり類（Japanese amberjack / yellowtail / Seriola属：ぶり・かんぱち・ひらまさ、英語では yellowtail, amberjack, hiramasa, kingfish, Seriola）」の
      養殖生産・輸出入・消費トレンド・価格・新規参入・陸上養殖の動きです。
      ぶり類の材料が乏しい場合は、他の魚種の養殖トレンド（サーモン、シーバス、ティラピア、えび、まぐろ等）や
      主要市場（米国・EU・中国・東南アジア）の水産物消費動向に広げてください。
      英語など日本語以外の情報源を積極的に使ってください。出典URLを必ず示してください。

  - id: "genai"
    title: "生成AIの重大ニュース"
    minutes: 5
    recency: "day"
    query: |
      生成AI・大規模言語モデル分野の直近48時間の重大ニュースを調べてください。
      対象は、主要モデルの発表・性能・価格、企業の資金調達や提携、規制・訴訟、
      実務に効く新機能、そして日本国内の動きです。
      「話題になっただけ」の噂ではなく、一次情報（企業の公式発表、論文、規制当局の文書）に基づくものを優先してください。
      出典URLを必ず示してください。

  - id: "education"
    title: "AI時代の教育トレンド"
    minutes: 5
    recency: "month"
    query: |
      「AI時代を見据えた幼児教育・初等教育がどう変わりつつあるか」について、
      直近1か月の世界の動向を調べてください。関心の中心は次の点です。
        - AI時代に重要性が増す／減ると論じられている能力は何か（研究・政策文書に基づくもの）
        - 各国の幼稚園・保育・小学校のカリキュラム改訂、スクリーンタイム方針、AI利用ルールの変更
        - 読み書き・計算・遊び・非認知能力の位置づけの変化
        - 実証研究やOECD・ユネスコ等の国際機関の報告
      日本の動向にも触れてください。意見記事と研究成果を区別し、出典URLを必ず示してください。

# 最後の横断ディスカッション。4テーマを結びつけて考える時間です。
discussion:
  title: "きょうの論点"
  minutes: 8
  instruction: |
    その日の4テーマを横断して、「つながり」と「popoの仕事への意味」を議論してください。
    popoは水産・食品の輸出戦略と補助金申請支援を専門とする一人コンサルタントで、
    鹿児島のぶり類養殖に深い知見があり、AIを使った業務の仕組み化にも取り組んでいます。
    生まれたばかりの子どもがいるため、教育の話は「10〜20年後にどう効いてくるか」の視点で扱ってください。
    ただし、無理にこじつけないこと。関係が薄い日は「今日は独立した話題です」と正直に言って構いません。

# 仮説の検証まわりの設定。中身（仮説そのもの）は hypotheses/ledger.yaml にあります。
hypothesis:
  enabled: true
  broadcast:
    minutes: 5                            # 「きょうの検証」コーナーの長さ
    discussion_minutes_when_checking: 5   # 検証がある日は、横断ディスカッションを短くする
