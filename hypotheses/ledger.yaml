# 論点台帳
#
# ここに置くのは「検定したい命題」ではなく、その日のニュースを置く座標軸です。
# 目的は、場当たり的なニュース羅列にしないこと。細かい数字を当てにいくことではありません。
#
# だから次の3つを守ります。
#   - 論点は大きく持つ（生産・流通・販売・横断）。個別の相場を追う話にしない。
#   - 番組では確からしさの数字を読み上げない。追い風か逆風かを言葉で言う。
#   - 1回につき1本だけ扱い、連日同じ論点をこすらない。
#
# confidence は内部の目安で、放送では使いません。
# 全件 0.5（どちらとも言えない）から始めます。初期の見立てに引っ張られないためです。
settings:
  active_limit: 6
  deep_dive_slots: 1        # 1回につき扱う論点は1本だけ
  cooldown_days: 3          # 同じ論点を連日扱わない
  probation_days: 30
  archive_days: 60
  graduate_confidence: 0.9
  refute_confidence: 0.15
  sustain_days: 21

hypotheses:
- id: L-1
  theme: jp_fisheries
  axis: 生産
  statement: 養殖の競争力の源泉が、規模と餌のコスト勝負から、種苗・育種と斃死率のコントロールへ移りつつある。
  created: '2026-08-27'
  confidence: 0.5
  status: active
  decision_link: 養殖案件で、飼料の置き換えと生残率の改善のどちらを提案の軸に置くか
  falsifiers:
  - text: 種苗・育種や斃死率よりも、餌のコストが収益差の主因だと示すデータが出る
    keywords: [飼料, 餌, コスト, 採算, 収益]
  - text: 育種・種苗への投資が縮小する、または効果が出ていないという報告が出る
    keywords: [育種, 種苗, 投資, 撤退]
  next_indicators:
  - neutral_query: 養殖 種苗 育種 成果 最新
  - neutral_query: 養殖 斃死率 生残率 データ
  evidence: []
  ops: {}

- id: L-2
  theme: world_fisheries
  axis: 流通
  statement: 水産物の流通は、鮮度を遠くへ運ぶ方向と、需要地の近くで作って加工する方向へ分岐している。
  created: '2026-08-27'
  confidence: 0.5
  status: active
  decision_link: 輸出を伸ばすのか、現地生産・現地加工に投資するのか
  falsifiers:
  - text: 長距離の生鮮輸送（航空・活魚）が拡大し、需要地生産は伸びていない
    keywords: [航空輸送, 生鮮, 活魚, 輸送能力]
  - text: 陸上養殖や現地加工の事業が採算割れで撤退・縮小している
    keywords: [陸上養殖, RAS, 撤退, 破綻, 縮小]
  next_indicators:
  - neutral_query: 陸上養殖 商業生産 稼働 最新
  - neutral_query: 水産物 輸送 コールドチェーン 動向
  evidence: []
  ops: {}

- id: L-3
  theme: jp_fisheries
  axis: 販売
  statement: ぶり類は国内需要の停滞と輸出の伸びが同時に進み、価格の決まり方が輸出側の事情に寄りつつある。
  created: '2026-08-27'
  confidence: 0.5
  status: active
  decision_link: 国内市場向けの商品設計を続けるか、輸出仕様に寄せるか
  falsifiers:
  - text: 国内の消費や単価が回復し、輸出比率が下がる
    keywords: [国内消費, 家計調査, 単価, 内需]
  - text: 輸出が減速しても国内の産地価格が下がらない
    keywords: [輸出, 減少, 産地価格, 浜値]
  next_indicators:
  - neutral_query: ぶり かんぱち 輸出 実績 最新
  - neutral_query: 水産物 国内消費 単価 動向
  evidence: []
  ops: {}

- id: L-4
  theme: world_fisheries
  axis: 横断
  statement: 水産事業の収益の振れは、資源量や相場よりも、制度・貿易ルール（関税・規制・認証）の変化に左右される比重が増している。
  created: '2026-08-27'
  confidence: 0.5
  status: active
  decision_link: 事業リスクの見積もりで、資源変動と制度変更のどちらに重みを置くか
  falsifiers:
  - text: 収益の変動が、制度変更ではなく資源量や相場でほぼ説明できる事例が示される
    keywords: [資源量, 漁獲量, 相場, 変動要因]
  - text: 主要市場で関税・規制・認証要件の変更がしばらく起きていない
    keywords: [関税, 規制, 認証, 撤廃, 据え置き]
  next_indicators:
