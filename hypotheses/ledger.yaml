# 仮説台帳
#
# 「今日は何があったか」だけを追う番組から、「この見立ては正しいのか」を
# 毎朝すこしずつ検証していく番組にするための台帳です。
#
# confidence（確からしさ）は 0.05〜0.95 の範囲で、番組が自動で上下させます。
# 人が直接書き換えるのは statement / falsifiers / next_indicators / decision_link の4つで、
# それ以外は仕組みが管理します。
#
# 大事なのは falsifiers（崩壊条件）です。「何が観測されたらこの仮説を捨てるか」を
# 先に書いておくことで、都合のいい材料だけを集めてしまうのを防ぎます。
# 崩壊条件を2つ書けない仮説は、そもそも検証できない仮説なので採用しません。

settings:
  active_limit: 6          # 同時に追う仮説の上限。増やすと1本あたりが薄くなる
  deep_dive_slots: 2       # 1回の番組で深掘りする本数
  cooldown_days: 2          # 同じ仮説を連日深掘りしない日数
  probation_days: 21       # 支持証拠がこれだけ出なければ「様子見」に降格
  archive_days: 45         # さらに出なければ棚上げ
  graduate_confidence: 0.90  # ここまで上がった状態が続けば「前提」に格上げ
  refute_confidence: 0.15    # ここまで下がった状態が続けば棚上げ
  sustain_days: 14           # 上の2つの判定に必要な継続日数

